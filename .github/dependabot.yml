# Atualizações semanais de dependências (pub e actions do CI). As actions do CI
# estão fixadas por SHA; o Dependabot propõe a troca do SHA quando sai versão nova.
#
# Agrupadas: um único PR por semana e por ecossistema, em vez de uma branch por pacote
# (o que enchia o repositório de branches). As do banco (drift, sqlite3) continuam
# exigindo o teste de restaurar backup no app de release antes de mesclar.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencias-pub:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-do-ci:
        patterns:
          - "*"
